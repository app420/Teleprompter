<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico Teleprompter</title>
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; background: #111; color: #eee; padding: 16px; font-size: 18px; line-height: 1.5; }
  h1 { font-size: 22px; }
  li { margin-bottom: 8px; }
  .ok { color: #6f6; } .bad { color: #f66; } .wait { color: #fc6; }
  small { color: #999; font-size: 14px; word-break: break-all; }
</style>
</head>
<body>
<h1>Diagnóstico — tire uma foto desta tela</h1>
<ol id="list"></ol>
<p><small id="ua"></small></p>
<script>
(function () {
  'use strict';
  var list = document.getElementById('list');
  var items = {};
  function item(id, label) {
    var li = document.createElement('li');
    li.innerHTML = label + ': <span class="wait">aguardando...</span>';
    list.appendChild(li); items[id] = li.getElementsByTagName('span')[0];
  }
  function set(id, ok, msg) { items[id].className = ok ? 'ok' : 'bad'; items[id].textContent = msg; }

  document.getElementById('ua').textContent = navigator.userAgent + ' | ' + location.href + ' | ' + new Date().toString();

  window.onerror = function (m, u, l) { var li = document.createElement('li'); li.className = 'bad'; li.textContent = 'ERRO JS: ' + m + ' (linha ' + l + ')'; list.appendChild(li); };

  function xhrTest(id, label, url) {
    item(id, label);
    try {
      var x = new XMLHttpRequest();
      x.open('GET', url + (url.indexOf('?') < 0 ? '?' : '&') + 't=' + new Date().getTime(), true);
      x.onreadystatechange = function () {
        if (x.readyState !== 4) return;
        if (x.status) set(id, x.status < 400, 'HTTP ' + x.status + ' (' + (x.responseText || '').length + ' bytes)');
        else set(id, false, 'status 0 (bloqueado: rede, certificado ou CORS)');
      };
      x.onerror = function () { set(id, false, 'onerror (bloqueado: rede, certificado ou CORS)'); };
      x.send();
    } catch (e) { set(id, false, 'exceção: ' + e.message); }
  }

  /* 1. mesma origem */
  xhrTest('t1', '1. XHR para esta mesma página (github.io)', location.href.split('?')[0]);
  /* 2. raiz da API do GitHub */
  xhrTest('t2', '2. XHR para https://api.github.com/', 'https://api.github.com/');
  /* 3. repositório público via API */
  xhrTest('t3', '3. XHR para api.github.com/repos/app420/teleprompter', 'https://api.github.com/repos/app420/teleprompter');
  /* 4. raw.githubusercontent.com */
  xhrTest('t4', '4. XHR para raw.githubusercontent.com', 'https://raw.githubusercontent.com/app420/teleprompter/main/index.html');
  /* 5. JSONP (tag script, sem CORS) */
  item('t5', '5. JSONP (script) para api.github.com/zen');
  window.__zen = function (d) { set('t5', true, 'OK — ' + JSON.stringify(d && d.data ? d.data : d).slice(0, 60)); };
  var s = document.createElement('script');
  s.src = 'https://api.github.com/zen?callback=__zen&t=' + new Date().getTime();
  s.onerror = function () { set('t5', false, 'falhou ao carregar o script'); };
  document.body.appendChild(s);
  setTimeout(function () { if (items.t5.className === 'wait') set('t5', false, 'sem resposta em 20 s'); }, 20000);
  /* 6. imagem de outro site (só rede/certificado, sem CORS) */
  item('t6', '6. Imagem de github.com (avatar)');
  var img = new Image();
  img.onload = function () { set('t6', true, 'carregou'); };
  img.onerror = function () { set('t6', false, 'falhou'); };
  img.src = 'https://github.com/favicon.ico?t=' + new Date().getTime();
})();
</script>
</body>
</html>
